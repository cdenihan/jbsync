[tools]
zig = "0.17.0"

[tasks.build]
description = "Build the production Apple Silicon binary"
run = "zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe"

[tasks.test]
description = "Run native tests and disposable CLI scenarios"
run = ["zig build test", "zig build", "python3 tests/zig/integration.py zig-out/bin/jbsync"]

[tasks.fmt]
description = "Check Zig formatting"
run = "zig fmt --check build.zig build.zig.zon src"

[tasks.ci]
description = "Run the full production validation suite"
run = "sh scripts/check.sh"
