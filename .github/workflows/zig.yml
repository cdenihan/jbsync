name: Zig rewrite experiment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zig-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Apple Silicon / ${{ matrix.mode }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: zig fmt --check build.zig build.zig.zon src
      - run: zig build test --summary all -Dtarget=aarch64-macos -Doptimize=${{ matrix.mode }}
      - run: zig build validation -Dtarget=aarch64-macos -Doptimize=${{ matrix.mode }}
      - run: zig build -Dtarget=aarch64-macos -Doptimize=${{ matrix.mode }}
      - run: python3 tests/zig/integration.py zig-out/bin/jbsync
      - run: cargo build --locked --example validation_oracle --bin jbsync
      - run: python3 tests/zig/differential.py zig-out/bin/jbsync-validation target/debug/examples/validation_oracle
      - run: python3 tests/zig/migration.py zig-out/bin/jbsync target/debug/jbsync
      - run: sh tests/zig/platform.sh
      - run: python3 tests/zig/installer.py zig-out/bin/jbsync
      - uses: actions/upload-artifact@v4
        with:
          name: jbsync-zig-macos-aarch64-${{ matrix.mode }}
          path: zig-out/bin/jbsync
