name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public jbsync release version
        required: true
        type: string
      tag:
        description: Reserved Git tag
        required: true
        type: string
      commit:
        description: Bot-authored release commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify trusted release inputs
    runs-on: macos-15
    outputs:
      cache-write: ${{ steps.verify.outputs.cache-write }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Verify tag, version, commit, and dispatch ref
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          [[ "$GITHUB_REF" == "refs/heads/${default_branch}" ]]
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          tagged_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          [[ "$tagged_commit" == "$RELEASE_COMMIT" ]]
          git fetch origin "$default_branch"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/${default_branch}"
          echo 'cache-write=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build Apple Silicon Rust baseline
    needs: verify-release
    env:
      DEPENDENCY_TOKEN: ${{ secrets.RUST_CLI_TOOLKIT_TOKEN }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - name: Authenticate private Cargo dependencies
        if: env.DEPENDENCY_TOKEN != ''
        shell: bash
        run: git config --global url."https://x-access-token:${DEPENDENCY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: v1-rust
          shared-key: release-${{ github.repository_id }}-aarch64-apple-darwin
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ needs.verify-release.outputs.cache-write == 'true' }}
      - name: Build
        run: cargo build --locked --release --target aarch64-apple-darwin --package jbsync
      - name: Verify compiled release version
        shell: bash
        run: |
          reported_version="$("target/aarch64-apple-darwin/release/jbsync" --version)"
          expected_version="jbsync ${{ inputs.version }}"
          [[ "$reported_version" == "$expected_version" ]] || {
            echo "Expected '$expected_version', got '$reported_version'" >&2
            exit 1
          }
      - name: Prepare artifact
        shell: bash
        run: |
          binary="jbsync"
          artifact="jbsync-macos-aarch64"
          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/${binary}" "dist/${artifact}"
          (cd dist && openssl dgst -sha256 -r "$artifact" > "$artifact.sha256")
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jbsync-macos-aarch64
          path: dist/*
          if-no-files-found: error
      - name: Remove private dependency credential
        if: always() && env.DEPENDENCY_TOKEN != ''
        shell: bash
        run: git config --global --unset-all url."https://x-access-token:${DEPENDENCY_TOKEN}@github.com/".insteadOf || true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Package Apple Silicon installer
        run: cp scripts/install.sh dist/install.sh
      - name: Add installer checksums
        shell: bash
        run: |
          printf '%s\n' '${{ inputs.version }}' > dist/VERSION
          chmod 0755 dist/install.sh
          (cd dist && openssl dgst -sha256 -r VERSION > VERSION.sha256)
          (cd dist && openssl dgst -sha256 -r install.sh > install.sh.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tagged_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          [[ "$tagged_commit" == "$RELEASE_COMMIT" ]] || {
            echo "Expected $RELEASE_TAG at $RELEASE_COMMIT, got $tagged_commit" >&2
            exit 1
          }
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "jbsync $RELEASE_VERSION" --generate-notes

  cleanup_failed_tag:
    name: Clean up failed release reservation
    if: ${{ always() && needs.publish.result != 'success' }}
    needs: [build, publish]
    runs-on: macos-15
    steps:
      - name: Delete this run's unused reserved tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          reserved_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
          [[ "$reserved_sha" != "$RELEASE_COMMIT" ]] ||
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
